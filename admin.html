<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>UniFECAF · Treinador de Vendas · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zalando+Sans:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green:#95DE68;--blue:#254AB9;--ink:#000B1A;--paper:#F0EEE9;--s1:#03152E;--s2:#0A2247;--border:rgba(240,238,233,.10);--text:#F0EEE9;--muted:#A3B1C9;--pink:#FF2B5F;--yellow:#F2CB0A;--fd:'Zalando Sans',sans-serif;--fu:'Roboto',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 500px at 50% -120px,#002156 0%,rgba(0,33,86,0) 70%),var(--ink);color:var(--text);font-family:var(--fu);min-height:100vh}
nav{margin:14px auto 0;width:min(1200px,calc(100% - 24px));border:1px solid rgba(240,238,233,.35);border-radius:10px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:700}
.brand small{font-family:var(--fu);font-weight:400;font-size:10px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase}
.logo{display:flex;align-items:center;gap:6px;font-size:18px}
.logo i{width:22px;height:22px;border:3px solid var(--text);border-radius:3px;display:inline-block;position:relative}
.logo i::after{content:'';position:absolute;inset:3px;background:var(--green);border-radius:1px}
.btn{background:var(--green);color:var(--ink);border:none;border-radius:6px;padding:9px 16px;font-weight:700;font-family:var(--fd);cursor:pointer;font-size:13px}
.btn.g{background:transparent;color:var(--text);border:1px solid rgba(240,238,233,.55)}
.btn:hover{opacity:.9}
main{width:min(1200px,calc(100% - 24px));margin:24px auto 60px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--fd);font-size:30px;font-weight:700}h1 em{font-style:normal;color:var(--green)}
.sub{color:var(--muted);font-size:13px}
.login{max-width:380px;margin:10vh auto 0;background:var(--paper);color:var(--ink);border:2px solid var(--green);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:10px}
.login h2{font-family:var(--fd)}
.inp{width:100%;background:#fff;border:1px solid rgba(0,11,26,.18);color:var(--ink);border-radius:6px;padding:11px 12px;font-size:14px;outline:none}
.inp.d{background:var(--s1);border-color:var(--border);color:var(--text)}
.err{color:#C4113F;font-size:12px;min-height:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:14px}
.kpi b{display:block;font-family:var(--fd);font-size:28px;font-weight:700}
.kpi span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.kpi.live b{color:var(--green)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tab{padding:7px 14px;border-radius:999px;border:1px solid var(--green);color:var(--text);font-size:12px;cursor:pointer;background:transparent}
.tab.on{background:var(--green);color:var(--ink);font-weight:700}
.card{background:var(--s1);border:1px solid var(--border);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;text-align:left;padding:10px 12px;background:rgba(240,238,233,.03);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:10px 12px;border-top:1px solid var(--border);white-space:nowrap}
tr.cl:hover td{background:rgba(149,222,104,.06);cursor:pointer}
td small{display:block;color:var(--muted);font-size:11px}
.n{text-align:right}.sc{font-family:var(--fd);font-weight:700;color:var(--green)}
.up{color:var(--green);font-weight:700}.down{color:var(--pink);font-weight:700}.eq{color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px}.dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(149,222,104,.2)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,11,26,.75);display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px;z-index:50;overflow:auto}
.mbox{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:20px;width:min(860px,100%);display:flex;flex-direction:column;gap:14px}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mh h2{font-family:var(--fd)}
svg{width:100%;height:auto;display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}
</style>
</head>

<div id="v-login" class="login">
  <h2>Painel do administrador</h2>
  <div class="sub" style="color:#3B4763">Digite a senha de administrador para ver acessos, tempo de uso e notas.</div>
  <input class="inp" id="pw" type="password" placeholder="Senha de admin" onkeydown="if(event.key==='Enter')entrar()">
  <div class="err" id="err"></div>
  <button class="btn" onclick="entrar()">Entrar</button>
</div>

<main id="v-main" class="hidden">
  <div><h1>Painel do <em>treinador</em></h1><div class="sub" id="upd"></div></div>
  <div class="kpis" id="kpis"></div>
  <div class="tools">
    <div class="tabs" id="tabs"><button class="tab on" data-v="users">👥 Consultores</button><button class="tab" data-v="sessions">🕒 Acessos recentes</button></div>
    <div style="display:flex;gap:8px"><input class="inp d" id="q" placeholder="Buscar nome ou e-mail" style="width:220px;padding:8px 12px" oninput="draw()"><button class="btn g" onclick="csv()">⬇ Exportar CSV</button></div>
  </div>
  <div class="card" id="tbl"></div>
</main>

<div class="modal hidden" id="modal" onclick="if(event.target===this)this.classList.add('hidden')"><div class="mbox" id="mbox"></div></div>

<script>
const API_URL = "https://srferoz-v2.pauloperboni.workers.dev";
const PW_KEY = 'srferoz_admin_pw';
let data = null, view = 'users', sortK = 'last_seen', sortD = -1;
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDur = s => { s = Math.round(s||0); if (s < 60) return s + 's'; const m = Math.floor(s/60); if (m < 60) return m + 'min'; return Math.floor(m/60) + 'h' + String(m%60).padStart(2,'0'); };
const fmtDate = t => t ? new Date(t*1000).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit'}) : '—';
const ago = t => { const s = Math.floor(Date.now()/1000) - t; if (s < 120) return 'agora'; if (s < 3600) return Math.floor(s/60) + ' min atrás'; if (s < 86400) return Math.floor(s/3600) + ' h atrás'; return Math.floor(s/86400) + ' d atrás'; };
async function call(path) {
  const r = await fetch(API_URL + path, {headers: {'X-Admin-Password': sessionStorage.getItem(PW_KEY) || ''}});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || 'Erro ' + r.status); e.status = r.status; throw e; }
  return d;
}
async function entrar() {
  sessionStorage.setItem(PW_KEY, document.getElementById('pw').value);
  document.getElementById('err').textContent = '';
  try { await load(); } catch (e) { document.getElementById('err').textContent = e.message; }
}
function sair() { sessionStorage.removeItem(PW_KEY); location.reload(); }
async function load() {
  data = await call('/admin');
  document.getElementById('v-login').classList.add('hidden');
  document.getElementById('v-main').classList.remove('hidden');
  document.getElementById('navr').classList.remove('hidden');
  document.getElementById('upd').textContent = 'Atualizado em ' + new Date().toLocaleString('pt-BR');
  const U = data.users, now = data.now;
  const live = U.filter(u => now - u.last_seen < 120).length;
  const tot = U.reduce((a, u) => a + u.seconds, 0), sims = U.reduce((a, u) => a + u.sims, 0);
  const scored = U.filter(u => u.sims), avg = scored.length ? Math.round(scored.reduce((a, u) => a + u.avg * u.sims, 0) / sims) : 0;
  const week = U.filter(u => now - u.last_seen < 7*86400).length;
  document.getElementById('kpis').innerHTML =
    `<div class="kpi live"><b>${live}</b><span>online agora</span></div><div class="kpi"><b>${U.length}</b><span>consultores</span></div>` +
    `<div class="kpi"><b>${week}</b><span>ativos 7 dias</span></div><div class="kpi"><b>${fmtDur(tot)}</b><span>tempo total de uso</span></div>` +
    `<div class="kpi"><b>${sims}</b><span>simulações</span></div><div class="kpi"><b>${avg || '—'}</b><span>nota média</span></div>`;
  draw();
}
document.querySelectorAll('#tabs .tab').forEach(b => b.onclick = () => { document.querySelectorAll('#tabs .tab').forEach(x => x.classList.remove('on')); b.classList.add('on'); view = b.dataset.v; draw(); });
function sortBy(k) { sortD = sortK === k ? -sortD : -1; sortK = k; draw(); }
function filt(arr) { const q = document.getElementById('q').value.trim().toLowerCase(); return q ? arr.filter(x => (x.name + ' ' + x.email).toLowerCase().includes(q)) : arr; }
function draw() {
  if (!data) return;
  const el = document.getElementById('tbl'), now = data.now;
  if (view === 'users') {
    const U = filt(data.users).slice().sort((a, b) => ((a[sortK] ?? -1) > (b[sortK] ?? -1) ? 1 : (a[sortK] ?? -1) < (b[sortK] ?? -1) ? -1 : 0) * sortD);
    if (!U.length) { el.innerHTML = '<div class="empty">Nenhum consultor ainda.</div>'; return; }
    const th = (k, l, n) => `<th class="${n ? 'n' : ''}" onclick="sortBy('${k}')">${l}${sortK === k ? (sortD > 0 ? ' ▲' : ' ▼') : ''}</th>`;
    el.innerHTML = `<table><tr>${th('name','Consultor')}${th('last_seen','Último acesso')}${th('logins','Acessos',1)}${th('seconds','Tempo de uso',1)}${th('sims','Simulações',1)}${th('best','Melhor',1)}${th('avg','Média',1)}<th class="n">Evolução</th></tr>` +
      U.map(u => { const ev = u.sims > 1 ? u.last_score - u.first_score : null;
        return `<tr class="cl" onclick="detalhe(${u.id})"><td><span class="dot ${now - u.last_seen < 120 ? 'on' : ''}"></span>${esc(u.name)}<small>${esc(u.email)}</small></td>` +
          `<td>${ago(u.last_seen)}<small>${fmtDate(u.last_seen)}</small></td><td class="n">${u.logins}</td><td class="n">${fmtDur(u.seconds)}</td><td class="n">${u.sims}</td>` +
          `<td class="n sc">${u.best ?? '—'}</td><td class="n">${u.avg ?? '—'}</td>` +
          `<td class="n">${ev === null ? '<span class="eq">—</span>' : `<span class="eq">${u.first_score} → ${u.last_score}</span> <span class="${ev > 0 ? 'up' : ev < 0 ? 'down' : 'eq'}">${ev > 0 ? '+' : ''}${ev}</span>`}</td></tr>`; }).join('') + '</table>';
  } else {
    const S = filt(data.sessions);
    if (!S.length) { el.innerHTML = '<div class="empty">Nenhum acesso ainda.</div>'; return; }
    el.innerHTML = '<table><tr><th>Consultor</th><th>Entrou em</th><th>Última atividade</th><th class="n">Tempo na sessão</th><th class="n">Simulações</th></tr>' +
      S.map(s => `<tr><td><span class="dot ${now - s.last_ping < 120 ? 'on' : ''}"></span>${esc(s.name)}<small>${esc(s.email)}</small></td><td>${fmtDate(s.started_at)}</td><td>${ago(s.last_ping)}</td><td class="n">${fmtDur(s.seconds)}</td><td class="n">${s.sims}</td></tr>`).join('') + '</table>';
  }
}
function chart(pts) {
  const W = 800, H = 220, P = {l: 34, r: 16, t: 18, b: 28}, n = pts.length, iw = W - P.l - P.r, ih = H - P.t - P.b;
  const x = i => P.l + (n === 1 ? iw/2 : i * iw / (n - 1)), y = v => P.t + ih - v/100*ih;
  let g = ''; [0,25,50,75,100].forEach(v => g += `<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(240,238,233,.08)"/><text x="${P.l-8}" y="${y(v)+4}" fill="#A3B1C9" font-size="10" text-anchor="end">${v}</text>`);
  const p = pts.map((q, i) => (i ? 'L' : 'M') + x(i) + ' ' + y(q.score)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}">${g}<path d="${p}" fill="none" stroke="#95DE68" stroke-width="2.5"/>` +
    pts.map((q, i) => `<circle cx="${x(i)}" cy="${y(q.score)}" r="5" fill="${q.mode === 'voice' ? '#254AB9' : '#95DE68'}" stroke="#000B1A" stroke-width="2"><title>${fmtDate(q.created_at)} · ${q.score}</title></circle>${n <= 25 ? `<text x="${x(i)}" y="${y(q.score) - 10}" fill="#F0EEE9" font-size="11" font-weight="700" text-anchor="middle">${q.score}</text>` : ''}`).join('') + '</svg>';
}
async function detalhe(id) {
  const m = document.getElementById('modal'), b = document.getElementById('mbox');
  b.innerHTML = '<div class="empty">Carregando...</div>'; m.classList.remove('hidden');
  try {
    const d = await call('/admin/user?id=' + id), r = d.results, u = data.users.find(x => x.id === id) || {};
    const dl = ['', 'Fácil', 'Médio', 'Difícil'];
    b.innerHTML = `<div class="mh"><div><h2>${esc(d.user.name)}</h2><div class="sub">${esc(d.user.email)} · ${u.logins || 0} acessos · ${fmtDur(u.seconds)} de uso</div></div><button class="btn g" onclick="document.getElementById('modal').classList.add('hidden')">Fechar</button></div>` +
      (r.length ? `<div class="kpis"><div class="kpi"><b>${r.length}</b><span>simulações</span></div><div class="kpi"><b>${u.best}</b><span>melhor</span></div><div class="kpi"><b>${u.avg}</b><span>média</span></div><div class="kpi"><b class="${u.last_score - u.first_score > 0 ? 'up' : u.last_score - u.first_score < 0 ? 'down' : ''}">${r.length > 1 ? (u.last_score - u.first_score > 0 ? '+' : '') + (u.last_score - u.first_score) : '—'}</b><span>1ª → última</span></div></div>` +
        `<div class="card" style="padding:14px">${chart(r)}</div>` +
        `<div class="card"><table><tr><th>Data</th><th>Módulo</th><th>Dificuldade</th><th>Perfil do lead</th><th class="n">Duração</th><th class="n">Nota</th></tr>` +
        r.slice().reverse().map(x => `<tr><td>${fmtDate(x.created_at)}</td><td>${x.mode === 'voice' ? '📞 Ligação' : '💬 WhatsApp'}</td><td>${dl[x.difficulty] || '—'}</td><td style="white-space:normal;max-width:260px">${esc(x.profile)}</td><td class="n">${fmtDur(x.duration)}</td><td class="n sc">${x.score}</td></tr>`).join('') + '</table></div>'
      : '<div class="empty">Ainda não fez nenhuma simulação.</div>');
  } catch (e) { b.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
}
function csv() {
  if (!data) return;
  const rows = [['Nome','E-mail','Primeiro acesso','Último acesso','Acessos','Tempo de uso (min)','Simulações','Melhor nota','Média','Primeira nota','Última nota']]
    .concat(data.users.map(u => [u.name, u.email, fmtDate(u.created_at), fmtDate(u.last_seen), u.logins, Math.round(u.seconds/60), u.sims, u.best ?? '', u.avg ?? '', u.first_score ?? '', u.last_score ?? '']));
  const txt = '﻿' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type: 'text/csv;charset=utf-8'})); a.download = 'treinador-consultores.csv'; a.click();
}
if (sessionStorage.getItem(PW_KEY)) load().catch(() => sessionStorage.removeItem(PW_KEY));
</script>
